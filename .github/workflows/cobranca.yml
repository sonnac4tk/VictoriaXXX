name: Cobrança da luz

on:
  schedule:
    - cron: "47 11 * * *" # todo dia, ~8h47 no horário de Brasília
  workflow_dispatch: # permite rodar na mão pela aba Actions
    inputs:
      simulacao:
        description: "Só simular (não envia e-mails, mostra no log)"
        type: boolean
        default: true
      data:
        description: "Fingir que hoje é (AAAA-MM-DD, opcional)"
        required: false

jobs:
  cobrar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobranca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python cobranca.py
        env:
          # Segredos (Settings > Secrets and variables > Actions > Secrets)
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_RESPONSAVEL: ${{ secrets.EMAIL_RESPONSAVEL }}
          CHAVE_PIX: ${{ secrets.CHAVE_PIX }}
          # Configurações (Settings > Secrets and variables > Actions > Variables)
          NOME_PREDIO: ${{ vars.NOME_PREDIO }}
          REMETENTE_NOME: ${{ vars.REMETENTE_NOME }}
          DIA_EXTRATO: ${{ vars.DIA_EXTRATO }}
          INTERVALO_LEMBRETE: ${{ vars.INTERVALO_LEMBRETE }}
          SUGESTAO_CREDITO: ${{ vars.SUGESTAO_CREDITO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.simulacao || vars.DRY_RUN }}
          DATA_HOJE: ${{ inputs.data }}
