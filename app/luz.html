<title>Luz do Prédio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: uma coluna estreita de app de celular — visor do medidor no topo, moradores como cartões, ações fixas embaixo. */
:root {
  --bg: #F2F3EF;
  --surface: #FFFFFF;
  --ink: #1B2230;
  --muted: #5B6474;
  --line: #DCDFD7;
  --accent: #E9A416;
  --accent-ink: #1B2230;
  --meter: #1B2230;
  --meter-ink: #F6D27A;
  --ok: #1D7A4C;
  --ok-bg: #E3F2E9;
  --bad: #B3261E;
  --bad-bg: #FBE6E3;
  --wa: #1D7A4C;
  --wa-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(27,34,48,.06), 0 4px 16px rgba(27,34,48,.06);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151C; --surface: #1A202B; --ink: #ECEEF2; --muted: #9AA3B3; --line: #2A3242;
    --accent: #F2B632; --accent-ink: #1B2230; --meter: #0B0E13; --meter-ink: #F6D27A;
    --ok: #57C892; --ok-bg: rgba(87,200,146,.13); --bad: #F2847A; --bad-bg: rgba(242,132,122,.13);
    --wa: #2E9B63; --wa-ink: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151C; --surface: #1A202B; --ink: #ECEEF2; --muted: #9AA3B3; --line: #2A3242;
  --accent: #F2B632; --accent-ink: #1B2230; --meter: #0B0E13; --meter-ink: #F6D27A;
  --ok: #57C892; --ok-bg: rgba(87,200,146,.13); --bad: #F2847A; --bad-bg: rgba(242,132,122,.13);
  --wa: #2E9B63; --wa-ink: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 120px; display: grid; gap: 22px; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; font-weight: 600; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sub { color: var(--muted); font-size: .9rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, .btn {
  font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 9px 14px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  min-height: 42px;
}
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wa { background: var(--wa); color: var(--wa-ink); border-color: var(--wa); }
.ghost { background: transparent; }
.danger { color: var(--bad); }
.icon { min-width: 42px; padding: 8px; }

/* Visor do medidor */
.meter { background: var(--meter); color: var(--meter-ink); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.meter .label { color: color-mix(in srgb, var(--meter-ink) 70%, transparent); }
.reading { display: flex; gap: 4px; flex-wrap: wrap; }
.reading span { font-family: var(--f-mono); font-weight: 600; font-size: 1.9rem; background: color-mix(in srgb, var(--meter-ink) 10%, transparent);
  border-radius: 6px; padding: 2px 8px; min-width: 1.3em; text-align: center; }
.meter-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .92rem; }
.meter-row b { font-family: var(--f-mono); font-weight: 600; }

/* Moradores */
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-head > div { min-width: 0; }
.name { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.pill { font-family: var(--f-mono); font-weight: 600; font-size: .9rem; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.zero { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card-actions .wa { flex: 1 1 160px; }
.note { font-size: .82rem; color: var(--muted); }

/* Histórico */
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.hist-row:first-child { border-top: 0; }
.hist-row .grow { flex: 1; min-width: 0; }
.hist-row .val { font-family: var(--f-mono); font-weight: 600; white-space: nowrap; }
.tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; }
.tag.conta { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--ink); }
.tag.pix { background: var(--ok-bg); color: var(--ok); }
.empty { padding: 18px; color: var(--muted); text-align: center; }

/* Barra de ações */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Folha (modal) */
.scrim { position: fixed; inset: 0; background: rgba(10,12,16,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; max-height: 92%; overflow: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; }
@media (min-width: 620px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; }
.hint { font-size: .8rem; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
textarea { min-height: 200px; resize: vertical; line-height: 1.45; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.check input { width: 20px; min-height: 20px; height: 20px; accent-color: var(--accent); }
.stack { display: grid; gap: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet-actions > * { flex: 1 1 140px; }
.split { font-size: .88rem; color: var(--muted); }
.split b { color: var(--ink); font-family: var(--f-mono); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
.banner { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 12px 14px; font-weight: 500; }
.welcome { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
.welcome ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(16px); opacity: .6; } } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="titulo">Luz do Prédio</h1>
      <div class="sub">Rateio da conta de luz entre os moradores</div>
    </div>
    <button class="icon ghost" data-act="config" aria-label="Configurações" title="Configurações">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div id="banner" hidden></div>
  <section id="meter"></section>
  <section id="moradores" class="list"></section>
  <section id="historico"></section>
</div>

<nav class="bar" id="bar" hidden>
  <div class="bar-in">
    <button class="primary" data-act="nova-conta">+ Conta de luz</button>
    <button data-act="novo-pix">+ PIX recebido</button>
  </div>
</nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const S = { db: null, cfg: {}, moradores: [], contas: [], pagamentos: [], loaded: new Set(), err: "", confirm: null, histTodos: false };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- dinheiro e datas ----------
  const brl = (cents) => {
    const v = Math.abs(cents) / 100;
    return "R$ " + v.toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  };
  const parseBRL = (txt) => {
    let t = String(txt || "").replace(/[^\d,.]/g, "");
    if (!t) return null;
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
    const n = Number(t);
    return Number.isFinite(n) && n > 0 ? Math.round(n * 100) : null;
  };
  const centsToInput = (c) => (c / 100).toFixed(2).replace(".", ",");
  const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const mesAtual = () => hoje().slice(0, 7);
  const nomeMes = (ym) => { const [a, m] = String(ym).split("-"); return MESES[Number(m) - 1] ? `${MESES[Number(m) - 1]}/${a}` : ym; };
  const dataBR = (iso) => { const [a, m, d] = String(iso).split("-"); return d ? `${d}/${m}/${a}` : iso; };
  const fone = (t) => { let d = String(t || "").replace(/\D/g, ""); if (d.length === 10 || d.length === 11) d = "55" + d; return d; };

  // ---------- cálculo ----------
  const parte = (c) => (c.moradores?.length ? Math.round(c.valor / c.moradores.length) : 0);
  const contasOrd = () => [...S.contas].sort((a, b) => (a.mes < b.mes ? 1 : a.mes > b.mes ? -1 : 0));
  function saldos() {
    const out = {};
    for (const m of S.moradores) out[m.id] = { pago: 0, devido: 0 };
    for (const c of S.contas) for (const id of c.moradores || []) if (out[id]) out[id].devido += parte(c);
    for (const p of S.pagamentos) if (out[p.moradorId]) out[p.moradorId].pago += p.valor;
    for (const id in out) out[id].saldo = out[id].pago - out[id].devido;
    return out;
  }
  const moradoresOrd = () => [...S.moradores].sort((a, b) => String(a.apto).localeCompare(String(b.apto), "pt-BR", { numeric: true }));

  function mensagem(m, saldo) {
    const primeiro = (m.nome || "").trim().split(/\s+/)[0] || "tudo bem";
    const ult = contasOrd().find((c) => (c.moradores || []).includes(m.id));
    let t = `Oi, ${primeiro}!`;
    if (ult) t += ` A conta de luz do prédio de ${nomeMes(ult.mes)} veio ${brl(ult.valor)}. Dividida por ${ult.moradores.length}, sua parte é ${brl(parte(ult))}.`;
    t += "\n\n";
    if (saldo < 0) {
      t += `Seu saldo: devendo ${brl(-saldo)}.`;
      if (S.cfg.pix) t += `\nChave PIX: ${S.cfg.pix}`;
      const sug = parseBRL(S.cfg.sugestao);
      if (sug && sug > -saldo) t += `\n\nSe preferir, pode mandar ${brl(sug)}: o que sobrar fica de crédito para os próximos meses.`;
    } else if (saldo > 0) {
      t += `Já descontei do seu crédito. Você ainda tem ${brl(saldo)} de crédito, não precisa pagar nada agora.`;
    } else {
      t += "Seu saldo está zerado, não precisa pagar nada agora.";
    }
    t += "\n\nObrigado!";
    if (S.cfg.assinatura) t += `\n${S.cfg.assinatura}`;
    return t;
  }

  // ---------- render ----------
  function render() {
    const ready = ["moradores", "contas", "pagamentos", "cfg"].every((k) => S.loaded.has(k));
    $("titulo").textContent = S.cfg.predio ? `Luz · ${S.cfg.predio}` : "Luz do Prédio";
    const b = $("banner");
    b.hidden = !S.err; b.className = "banner"; b.textContent = S.err;

    if (!S.db) { $("meter").innerHTML = ""; $("moradores").innerHTML = ""; $("historico").innerHTML = ""; $("bar").hidden = true; return; }
    if (!ready) {
      $("meter").innerHTML = `<div class="meter"><div class="label">Carregando…</div><div class="reading"><span>-</span><span>-</span><span>,</span><span>-</span><span>-</span></div></div>`;
      return;
    }

    const sal = saldos();
    const ult = contasOrd()[0];
    const aReceber = S.moradores.filter((m) => m.cobrar !== false).reduce((s, m) => s + Math.min(0, sal[m.id].saldo), 0);
    const credito = S.moradores.filter((m) => m.cobrar !== false).reduce((s, m) => s + Math.max(0, sal[m.id].saldo), 0);

    // visor
    if (ult) {
      const digits = brl(ult.valor).replace("R$ ", "");
      $("meter").innerHTML = `<div class="meter">
        <div class="meter-row"><span class="label">Última conta · ${esc(nomeMes(ult.mes))}</span><span class="label">${ult.moradores.length} moradores</span></div>
        <div class="reading" aria-label="${esc(brl(ult.valor))}"><span>R$</span>${[...digits].map((ch) => `<span>${esc(ch)}</span>`).join("")}</div>
        <div class="meter-row"><span>Parte de cada um <b>${brl(parte(ult))}</b></span><span>A receber <b>${brl(-aReceber)}</b></span><span>Créditos <b>${brl(credito)}</b></span></div>
      </div>`;
    } else {
      $("meter").innerHTML = `<div class="meter"><div class="label">Nenhuma conta lançada ainda</div><div class="reading"><span>R$</span><span>0</span><span>,</span><span>0</span><span>0</span></div>
        <div class="meter-row"><span>Quando a conta de luz chegar, toque em <b>+ Conta de luz</b>.</span></div></div>`;
    }

    // moradores
    if (!S.moradores.length) {
      $("moradores").innerHTML = `<div class="welcome"><h2>Comece cadastrando os moradores</h2>
        <ol><li>Cadastre os moradores com o WhatsApp de cada um. Inclua você também, com "Cobrar" desmarcado: sua parte entra na divisão, mas você não recebe cobrança.</li>
        <li>Coloque sua chave PIX em Configurações.</li>
        <li>Quando a luz chegar, lance a conta. Quando alguém pagar, lance o PIX.</li>
        <li>Toque em "Enviar no WhatsApp" para mandar o saldo de cada um.</li></ol>
        <button class="primary" data-act="novo-morador">+ Cadastrar morador</button></div>`;
    } else {
      $("moradores").innerHTML = `<div class="top"><h2>Moradores</h2><button class="ghost" data-act="novo-morador">+ Morador</button></div>` +
        moradoresOrd().map((m) => {
          const s = sal[m.id].saldo;
          const cls = m.cobrar === false ? "zero" : s < 0 ? "bad" : s > 0 ? "ok" : "zero";
          const txt = m.cobrar === false ? "responsável" : s < 0 ? `deve ${brl(-s)}` : s > 0 ? `crédito ${brl(s)}` : "em dia";
          const acoes = m.cobrar === false
            ? `<span class="note">Não recebe cobrança (sua parte entra na divisão).</span>`
            : `<button class="wa" data-act="whats" data-id="${esc(m.id)}">${s < 0 ? "Cobrar no WhatsApp" : "Enviar saldo no WhatsApp"}</button>
               <button data-act="novo-pix" data-id="${esc(m.id)}">Recebi PIX</button>`;
          return `<article class="card">
            <div class="card-head"><div><div class="name">${esc(m.nome) || "Sem nome"}</div><div class="sub">Apto ${esc(m.apto)}${m.telefone ? " · " + esc(m.telefone) : ""}</div></div>
              <span class="pill ${cls}">${txt}</span></div>
            <div class="card-actions">${acoes}<button class="icon ghost" data-act="editar-morador" data-id="${esc(m.id)}" aria-label="Editar ${esc(m.nome)}" title="Editar">✎</button></div>
            ${m.avisadoEm ? `<div class="note">WhatsApp aberto em ${esc(dataBR(m.avisadoEm))}</div>` : ""}
          </article>`;
        }).join("");
    }

    // histórico
    const nomeDe = (id) => { const m = S.moradores.find((x) => x.id === id); return m ? `${m.nome} (${m.apto})` : "Morador removido"; };
    const itens = [
      ...S.contas.map((c) => ({ k: "conta", id: c.id, ord: c.mes + "-00", titulo: `Conta de ${nomeMes(c.mes)}`, det: `${brl(parte(c))} para cada um de ${c.moradores.length}`, valor: c.valor })),
      ...S.pagamentos.map((p) => ({ k: "pix", id: p.id, ord: p.data, titulo: nomeDe(p.moradorId), det: dataBR(p.data), valor: p.valor })),
    ].sort((a, b) => (a.ord < b.ord ? 1 : a.ord > b.ord ? -1 : 0));
    const mostrar = S.histTodos ? itens : itens.slice(0, 8);
    $("historico").innerHTML = S.moradores.length ? `<div class="top" style="margin-bottom:10px"><h2>Histórico</h2></div>
      <div class="hist">${mostrar.length ? mostrar.map((i) => {
        const key = i.k + ":" + i.id;
        const conf = S.confirm === key;
        return `<div class="hist-row"><span class="tag ${i.k}">${i.k === "conta" ? "Conta" : "PIX"}</span>
          <div class="grow"><div style="font-weight:600;overflow-wrap:anywhere">${esc(i.titulo)}</div><div class="note">${esc(i.det)}</div></div>
          <span class="val">${i.k === "pix" ? "+" : ""}${brl(i.valor)}</span>
          <button class="icon ghost ${conf ? "danger" : ""}" data-act="apagar" data-key="${esc(key)}" aria-label="${conf ? "Confirmar exclusão" : "Excluir"}" title="${conf ? "Toque de novo para excluir" : "Excluir"}">${conf ? "Excluir?" : "×"}</button></div>`;
      }).join("") : `<div class="empty">As contas e os PIX lançados aparecem aqui.</div>`}</div>
      ${itens.length > 8 ? `<div style="margin-top:8px"><button class="ghost" data-act="hist-todos">${S.histTodos ? "Mostrar menos" : `Ver tudo (${itens.length})`}</button></div>` : ""}` : "";

    $("bar").hidden = !S.moradores.length;
  }

  // ---------- modal ----------
  function abrir(html) { $("modal").innerHTML = `<div class="scrim" data-act="fechar-scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; $("modal").querySelector("input,select,textarea")?.focus(); }
  function fechar() { $("modal").innerHTML = ""; }
  const head = (t) => `<div class="sheet-head"><h2>${t}</h2><button class="icon ghost" data-act="fechar" aria-label="Fechar">✕</button></div>`;

  function formConta() {
    const ms = moradoresOrd();
    abrir(`${head("Lançar conta de luz")}
      <form id="f-conta" class="stack">
        <div class="row2">
          <div class="field"><label for="c-mes">Mês</label><input id="c-mes" type="month" value="${mesAtual()}" required></div>
          <div class="field"><label for="c-valor">Valor da conta</label><input id="c-valor" inputmode="decimal" placeholder="36,40" required></div>
        </div>
        <div class="field"><span class="lbl">Dividir entre</span>
          ${ms.map((m) => `<label class="check"><input type="checkbox" name="part" value="${esc(m.id)}" checked> ${esc(m.nome)} · Apto ${esc(m.apto)}</label>`).join("")}
        </div>
        <div class="split" id="c-split">Digite o valor para ver a parte de cada um.</div>
        <div class="sheet-actions"><button type="button" data-act="fechar">Cancelar</button><button class="primary" type="submit">Lançar conta</button></div>
      </form>`);
    const upd = () => {
      const v = parseBRL($("c-valor").value); const n = document.querySelectorAll('#f-conta [name=part]:checked').length;
      $("c-split").innerHTML = v && n ? `Parte de cada um: <b>${brl(Math.round(v / n))}</b>` : "Digite o valor para ver a parte de cada um.";
    };
    $("f-conta").addEventListener("input", upd);
    $("f-conta").addEventListener("submit", async (e) => {
      e.preventDefault();
      const valor = parseBRL($("c-valor").value), mes = $("c-mes").value;
      const ids = [...document.querySelectorAll('#f-conta [name=part]:checked')].map((x) => x.value);
      if (!valor) return toast("Digite o valor da conta, por exemplo 36,40.");
      if (!/^\d{4}-\d{2}$/.test(mes)) return toast("Escolha o mês da conta.");
      if (!ids.length) return toast("Marque pelo menos um morador.");
      if (await salvar(() => S.db.collection("contas").add({ mes, valor, moradores: ids, criadoEm: new Date().toISOString() }))) { fechar(); toast(`Conta de ${nomeMes(mes)} lançada.`); }
    });
  }

  function formPix(id) {
    const ms = moradoresOrd().filter((m) => m.cobrar !== false);
    const sal = saldos();
    const sel = id || ms[0]?.id;
    const sugestao = (mid) => (sal[mid] && sal[mid].saldo < 0 ? centsToInput(-sal[mid].saldo) : "");
    abrir(`${head("PIX recebido")}
      <form id="f-pix" class="stack">
        <div class="field"><label for="p-mor">Quem pagou</label>
          <select id="p-mor">${ms.map((m) => `<option value="${esc(m.id)}" ${m.id === sel ? "selected" : ""}>${esc(m.nome)} · Apto ${esc(m.apto)}</option>`).join("")}</select></div>
        <div class="row2">
          <div class="field"><label for="p-valor">Valor</label><input id="p-valor" inputmode="decimal" placeholder="50,00" value="${sugestao(sel)}" required></div>
          <div class="field"><label for="p-data">Data</label><input id="p-data" type="date" value="${hoje()}" required></div>
        </div>
        <div class="hint">Pode lançar valor maior que a dívida: o que sobrar vira crédito.</div>
        <div class="sheet-actions"><button type="button" data-act="fechar">Cancelar</button><button class="primary" type="submit">Lançar PIX</button></div>
      </form>`);
    $("p-mor").addEventListener("change", () => { $("p-valor").value = sugestao($("p-mor").value); });
    $("f-pix").addEventListener("submit", async (e) => {
      e.preventDefault();
      const valor = parseBRL($("p-valor").value), moradorId = $("p-mor").value, data = $("p-data").value;
      if (!moradorId) return toast("Cadastre um morador primeiro.");
      if (!valor) return toast("Digite o valor recebido, por exemplo 50,00.");
      if (await salvar(() => S.db.collection("pagamentos").add({ moradorId, valor, data, criadoEm: new Date().toISOString() }))) { fechar(); toast(`PIX de ${brl(valor)} lançado.`); }
    });
  }

  function formMorador(id) {
    const m = S.moradores.find((x) => x.id === id) || { apto: "", nome: "", telefone: "", cobrar: true };
    abrir(`${head(id ? "Editar morador" : "Novo morador")}
      <form id="f-mor" class="stack">
        <div class="row2">
          <div class="field"><label for="m-apto">Apto</label><input id="m-apto" value="${esc(m.apto)}" placeholder="102" required></div>
          <div class="field"><label for="m-nome">Nome</label><input id="m-nome" value="${esc(m.nome)}" placeholder="Ana Souza" required></div>
        </div>
        <div class="field"><label for="m-tel">WhatsApp (com DDD)</label><input id="m-tel" type="tel" inputmode="tel" value="${esc(m.telefone)}" placeholder="(11) 98765-4321"></div>
        <label class="check"><input id="m-cobrar" type="checkbox" ${m.cobrar !== false ? "checked" : ""}> Cobrar pelo WhatsApp</label>
        <div class="hint">Desmarque para você mesmo: sua parte entra na divisão, mas você não aparece como devedor.</div>
        <div class="sheet-actions">
          ${id ? `<button type="button" class="danger" data-act="apagar-morador" data-id="${esc(id)}">${S.confirm === "mor:" + id ? "Toque de novo para excluir" : "Excluir morador"}</button>` : `<button type="button" data-act="fechar">Cancelar</button>`}
          <button class="primary" type="submit">Salvar</button></div>
      </form>`);
    $("f-mor").addEventListener("submit", async (e) => {
      e.preventDefault();
      const apto = $("m-apto").value.trim(), nome = $("m-nome").value.trim(), telefone = $("m-tel").value.trim(), cobrar = $("m-cobrar").checked;
      if (!apto || !nome) return toast("Preencha apto e nome.");
      if (cobrar && fone(telefone).length < 12) return toast("Digite o WhatsApp com DDD, ou desmarque Cobrar.");
      const body = { apto, nome, telefone, cobrar };
      const ok = await salvar(() => (id ? S.db.doc("moradores/" + id).update(body) : S.db.collection("moradores").add(body)));
      if (ok) { fechar(); toast(id ? "Morador atualizado." : `${nome} cadastrado.`); }
    });
  }

  function formWhats(id) {
    const m = S.moradores.find((x) => x.id === id); if (!m) return;
    const s = saldos()[id].saldo;
    const num = fone(m.telefone);
    abrir(`${head(`WhatsApp para ${esc(m.nome)}`)}
      <div class="field"><label for="w-msg">Mensagem (pode editar)</label><textarea id="w-msg">${esc(mensagem(m, s))}</textarea></div>
      <div class="hint">Número: <span class="mono">+${esc(num)}</span>. O WhatsApp abre com a mensagem pronta; é só tocar em enviar.</div>
      <div class="sheet-actions">
        <button type="button" data-act="copiar">Copiar mensagem</button>
        <a class="btn wa" id="w-link" target="_blank" rel="noopener" href="#">Abrir no WhatsApp</a>
      </div>`);
    const link = $("w-link");
    const upd = () => { link.href = `https://wa.me/${num}?text=${encodeURIComponent($("w-msg").value)}`; };
    upd();
    $("w-msg").addEventListener("input", upd);
    link.addEventListener("click", () => {
      const d = hoje();
      if (m.avisadoEm !== d) salvar(() => S.db.doc("moradores/" + id).update({ avisadoEm: d }), true);
      setTimeout(fechar, 300);
    });
  }

  function formConfig() {
    const c = S.cfg;
    abrir(`${head("Configurações")}
      <form id="f-cfg" class="stack">
        <div class="field"><label for="g-predio">Nome do prédio</label><input id="g-predio" value="${esc(c.predio)}" placeholder="Ed. Victoria"></div>
        <div class="field"><label for="g-pix">Sua chave PIX</label><input id="g-pix" value="${esc(c.pix)}" placeholder="celular, e-mail, CPF ou chave aleatória"></div>
        <div class="field"><label for="g-sug">Valor redondo sugerido para pagar adiantado</label><input id="g-sug" inputmode="decimal" value="${esc(c.sugestao ?? "50,00")}" placeholder="50,00">
          <div class="hint">Aparece na cobrança de quem deve. Deixe vazio para não sugerir.</div></div>
        <div class="field"><label for="g-ass">Assinatura da mensagem</label><input id="g-ass" value="${esc(c.assinatura)}" placeholder="Seu nome · Apto 101"></div>
        <div class="sheet-actions"><button type="button" data-act="fechar">Cancelar</button><button class="primary" type="submit">Salvar</button></div>
      </form>`);
    $("f-cfg").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = { predio: $("g-predio").value.trim(), pix: $("g-pix").value.trim(), sugestao: $("g-sug").value.trim(), assinatura: $("g-ass").value.trim() };
      if (await salvar(() => S.db.doc("luz/config").set(body))) { fechar(); toast("Configurações salvas."); }
    });
  }

  // ---------- gravação ----------
  async function salvar(fn, silencioso) {
    if (!S.db) { toast("Abra este app pelo link do claude.ai para salvar."); return false; }
    try { await fn(); return true; }
    catch (e) {
      if (!silencioso) {
        const code = e && e.code;
        toast(code === "invalid_argument" ? "Você não tem permissão para alterar estes dados." :
              code === "quota_exceeded" ? "O armazenamento encheu. Exclua lançamentos antigos." :
              "Não deu para salvar agora. Verifique a internet e tente de novo.");
      }
      return false;
    }
  }
  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2800); }

  // ---------- eventos ----------
  document.addEventListener("click", async (e) => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === "fechar-scrim" && e.target !== el) return;
    if (act !== "apagar" && act !== "apagar-morador" && S.confirm) { S.confirm = null; render(); }
    switch (act) {
      case "fechar": case "fechar-scrim": fechar(); break;
      case "config": formConfig(); break;
      case "nova-conta": if (!S.moradores.length) return toast("Cadastre os moradores primeiro."); formConta(); break;
      case "novo-pix": if (!S.moradores.some((m) => m.cobrar !== false)) return toast("Cadastre um morador para cobrar."); formPix(id); break;
      case "novo-morador": formMorador(); break;
      case "editar-morador": formMorador(id); break;
      case "whats": formWhats(id); break;
      case "hist-todos": S.histTodos = !S.histTodos; render(); break;
      case "copiar": {
        const txt = $("w-msg").value;
        try { await navigator.clipboard.writeText(txt); toast("Mensagem copiada."); }
        catch { $("w-msg").select(); toast("Selecionei a mensagem: copie com o menu do celular."); }
        break;
      }
      case "apagar": {
        const key = el.dataset.key;
        if (S.confirm !== key) { S.confirm = key; render(); return; }
        S.confirm = null;
        const [k, docId] = key.split(":");
        if (await salvar(() => S.db.doc((k === "conta" ? "contas/" : "pagamentos/") + docId).delete())) toast("Lançamento excluído.");
        render();
        break;
      }
      case "apagar-morador": {
        if (S.confirm !== "mor:" + id) { S.confirm = "mor:" + id; el.textContent = "Toque de novo para excluir"; return; }
        S.confirm = null;
        if (await salvar(() => S.db.doc("moradores/" + id).delete())) { fechar(); toast("Morador excluído."); }
        break;
      }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("modal").innerHTML) fechar(); });

  // ---------- dados ----------
  render();
  const use = window.claude?.use ? window.claude.use("db") : Promise.resolve(null);
  use.then((db) => {
    if (!db) {
      S.err = "Não foi possível acessar os dados. Abra este app pelo link do claude.ai, com sua conta.";
      render(); return;
    }
    S.db = db;
    const timer = setTimeout(() => { if (S.loaded.size < 4) { S.err = "Os dados estão demorando para carregar. Verifique a internet."; render(); } }, 10000);
    const ok = (k) => { S.loaded.add(k); if (S.loaded.size === 4) { clearTimeout(timer); if (S.err.startsWith("Os dados")) S.err = ""; } render(); };
    const fail = () => { clearTimeout(timer); S.err = "A conexão com os dados caiu. Recarregue a página."; render(); };
    const lista = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    db.collection("moradores").onSnapshot((s) => { S.moradores = lista(s); ok("moradores"); }, fail);
    db.collection("contas").onSnapshot((s) => { S.contas = lista(s).filter((c) => Number.isFinite(c.valor) && Array.isArray(c.moradores)); ok("contas"); }, fail);
    db.collection("pagamentos").onSnapshot((s) => { S.pagamentos = lista(s).filter((p) => Number.isFinite(p.valor)); ok("pagamentos"); }, fail);
    db.doc("luz/config").onSnapshot((d) => { S.cfg = (d.exists && d.data()) || {}; ok("cfg"); }, fail);
  });
})();
</script>
